name: FD Foods CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. Backend Verification & Security Checks
  # ============================================================================
  backend-verification:
    name: Backend Tests & Django Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fdfood_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'fd_/backend/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: ./fd_/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install daphne

      - name: Django Configuration & System Checks
        working-directory: ./fd_/backend
        env:
          POSTGRES_DB: fdfood_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-testing-long-secret-key-at-least-fifty-characters-here"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python manage.py check
          python manage.py collectstatic --noinput

      - name: Run Backend Automated Tests
        working-directory: ./fd_/backend
        env:
          POSTGRES_DB: fdfood_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-testing-long-secret-key-at-least-fifty-characters-here"
        run: |
          python manage.py migrate
          python manage.py test apps.core_tests --keepdb

  # ============================================================================
  # 2. Frontend Quality & Production Builds Verification
  # ============================================================================
  frontend-verification:
    name: Frontend Quality & Production Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'fd_/package-lock.json'

      - name: Install Root & Workspace Dependencies
        working-directory: ./fd_
        run: npm install

      - name: Run Frontend Quality, Viewport & Security Suites
        working-directory: ./fd_
        run: npm run test:frontend

      - name: Build All 4 React Applications
        working-directory: ./fd_
        env:
          VITE_API_BASE_URL: "/api"
        run: npm run build:all

      - name: Verify Build Output Assets
        working-directory: ./fd_
        run: |
          test -f customer-app/dist/index.html || exit 1
          test -f restaurant-app/dist/index.html || exit 1
          test -f delivery-partner-app/dist/index.html || exit 1
          test -f admin-app/dist/index.html || exit 1
          echo "All 4 React production bundles successfully verified."
