<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline • Mission Control Admin</title>
  <style>
    :root {
      --primary: #062817;
      --accent: #4ade80;
      --bg: #0b1510;
      --card-bg: #122119;
      --text: #f0fdf4;
      --muted: #86efac;
      --border: #1e3a2b;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Mukta Malar", sans-serif;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--primary);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.45rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 1.5rem;
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .tamil-text {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: -0.75rem;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: var(--accent);
      color: #062817;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .notice {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">FD</div>
    <h1>Mission Control Disconnected</h1>
    <p>Administrative telemetry, settlement reconciliation, dispute actions, and security controls require secure server connectivity.</p>
    <p class="tamil-text">நிர்வாக மேலாண்மை செயல்பாடுகளுக்கு நேரடி சர்வர் இணைப்பு தேவை.</p>
    <button class="btn" onclick="window.location.reload()">Reconnect Telemetry</button>
    <div class="notice">Administrative audits and actions are paused while offline.</div>
  </div>
</body>
</html>
