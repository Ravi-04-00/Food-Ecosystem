<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline • Fast Delivery</title>
  <style>
    :root {
      --primary: #22c55e;
      --bg: #f4fbf7;
      --text: #062817;
      --muted: #4b6354;
      --card-bg: #ffffff;
      --border: #d1fae5;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Mukta Malar", sans-serif;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .tamil-text {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: -0.75rem;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      box-sizing: border-box;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .notice {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">FD</div>
    <h1>You are currently offline</h1>
    <p>Fast Delivery requires an active internet connection to browse live menus, place orders, and track deliveries.</p>
    <p class="tamil-text">நேரடி மெனுக்கள் மற்றும் ஆர்டர் நிலவரங்களை பார்க்க இணைய இணைப்பு தேவை.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection • மீண்டும் முயற்சிக்கவும்</button>
    <div class="notice">Server-authoritative operations are paused while offline.</div>
  </div>
</body>
</html>
