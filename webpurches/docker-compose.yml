# ==============================================================================
# Fast Delivery (FD) - Production Docker Compose Orchestration
# Services: PostgreSQL 16, Redis 7, Daphne ASGI Backend, Nginx Frontends
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Authoritative PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: fd_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wsfood_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wsfood_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Redis Channel Layer & Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fd_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-fd_redis_secret}"]
    volumes:
      - redis_data:/data
    networks:
      - fd_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fd_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Django REST Framework & Daphne ASGI Real-Time Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fd_backend
    restart: always
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Django secret key must be set in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      POSTGRES_DB: ${POSTGRES_DB:-wsfood_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-fd_redis_secret}@redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://:${REDIS_PASSWORD:-fd_redis_secret}@redis:6379/0
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec_placeholder}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - fd_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/?check=liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 4. Frontend Web Apps & Nginx Ingress Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fd_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    networks:
      - fd_network
    depends_on:
      backend:
        condition: service_healthy

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: fd_postgres_data
  redis_data:
    name: fd_redis_data
  staticfiles_data:
    name: fd_staticfiles_data
  media_data:
    name: fd_media_data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  fd_network:
    name: fd_production_network
    driver: bridge
