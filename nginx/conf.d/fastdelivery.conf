# ==============================================================================
# Fast Delivery (FD) - Unified Production Reverse Proxy Virtual Host
# Routes 4 React Apps, DRF API, Daphne WebSockets, Static, and Media Assets
# ==============================================================================

upstream django_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Nginx Ingress Health Probe
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # 1. Backend REST API Routing
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Django Admin Portal
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 2. Real-Time Django Channels / WebSocket Routing
    # --------------------------------------------------------------------------
    location /FD/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Prolonged timeouts for persistent WebSocket streams & heartbeat
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 3. Static & Media Asset Delivery
    # --------------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Frontend Application Route Handlers (SPA Fallback Architecture)
    # --------------------------------------------------------------------------

    # [Portal 4] Admin Mission Control Portal
    location ^~ /admin-portal/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /usr/share/nginx/html/admin/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # [Portal 3] Delivery Partner Fleet Portal
    location ^~ /delivery/ {
        alias /usr/share/nginx/html/delivery/;
        try_files $uri $uri/ /usr/share/nginx/html/delivery/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # [Portal 2] Restaurant Partner Hub
    location ^~ /restaurant/ {
        alias /usr/share/nginx/html/restaurant/;
        try_files $uri $uri/ /usr/share/nginx/html/restaurant/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # [Portal 1] Customer Food Ordering Web App (Root Ingress)
    location / {
        root /usr/share/nginx/html/customer;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
